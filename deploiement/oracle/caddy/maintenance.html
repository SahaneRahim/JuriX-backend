<!doctype html>
<!--
  Servie par Caddy, en 503 avec Retry-After, quand le front ou l'API ne répond
  pas : conteneur arrêté, ou qui redémarre pendant une mise à jour. Autonome :
  ni police, ni image, ni fichier externe, que le front injoignable ne pourrait
  pas servir.

  Pas de balise meta refresh : un rechargement minuté, que le visiteur ne
  peut ni arrêter ni prolonger, est l'échec F41 de WCAG 2.2.1. Le lien
  « Réessayer » lui laisse la main ; le script, lui, ne recharge la page
  qu'une fois, le site de retour (statut sous 500), et seulement si l'adresse
  rend une page HTML : une adresse de téléchargement (PDF, pièce jointe)
  serait sinon rechargée, donc téléchargée, sans que le visiteur l'ait
  demandé. Dans ce cas, la page cesse d'interroger et garde le lien.
-->
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>JuriX revient dans un instant</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        background: #f8f9fa;
        color: #0f172a;
      }
      main {
        max-width: 32rem;
        padding: 2rem 1.5rem;
        text-align: center;
      }
      .marque {
        font-weight: 700;
        font-size: 1.25rem;
        color: #2563eb;
        margin: 0 0 1.5rem;
      }
      h1 {
        font-size: 1.5rem;
        margin: 0 0 0.75rem;
      }
      p {
        line-height: 1.6;
        margin: 0 0 0.5rem;
        color: #475569;
      }
      .reessayer {
        display: inline-block;
        margin-top: 1rem;
        padding: 0.625rem 1.25rem;
        border-radius: 0.75rem;
        background: #2563eb;
        color: #ffffff;
        font-weight: 600;
        text-decoration: none;
      }
      .reessayer:hover {
        background: #1d4ed8;
      }
      .reessayer:focus-visible {
        outline: 3px solid #93c5fd;
        outline-offset: 3px;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #0a1628;
          color: #f1f5f9;
        }
        p {
          color: #cbd5e1;
        }
        .marque {
          color: #60a5fa;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <p class="marque">JuriX</p>
      <h1>JuriX revient dans un instant</h1>
      <p>Le site est en cours de mise à jour ou de redémarrage.</p>
      <p>Réessayez dans quelques instants.</p>
      <a class="reessayer" href="">Réessayer</a>
    </main>
    <script>
      // Toutes les 30 s, le rythme du Retry-After. Une seule requete a la
      // fois : une reponse qui tarde ne doit pas en empiler d'autres.
      if (window.fetch) {
        var enCours = false;
        var minuterie = setInterval(function () {
          if (enCours) return;
          enCours = true;
          fetch(location.href, { cache: "no-store" })
            .then(function (reponse) {
              enCours = false;
              if (reponse.status >= 500) return;
              // Le site repond : plus d'interrogation, et le corps (peut-etre
              // un gros PDF) n'est pas lu.
              clearInterval(minuterie);
              if (reponse.body && reponse.body.cancel) reponse.body.cancel();
              var type = reponse.headers.get("Content-Type") || "";
              var disposition = reponse.headers.get("Content-Disposition") || "";
              if (/^text\/html/i.test(type) && !/attachment/i.test(disposition)) {
                location.reload();
              }
            })
            .catch(function () {
              enCours = false;
            });
        }, 30000);
      }
    </script>
  </body>
</html>
