# JuriX en production sur UNE machine : une VM ARM d'Oracle Cloud (palier
# « Always Free » : 2 coeurs, 12 Go de memoire, 200 Go de disque).
#
# Quatre conteneurs :
#   db     PostgreSQL 16 + pgvector. Aucun port publie : seule l'API le voit.
#   api    l'image du Dockerfile du depot (FastAPI). Les embeddings viennent
#          de l'API Voyage AI, en HTTPS sortant : aucun modele en memoire.
#   front  le serveur Node du front (SvelteKit, adapter-node) : pages rendues
#          par le serveur, et fichiers du build. deployer.sh l'envoie dans
#          front-node/.
#   caddy  le seul expose (80 et 443) : certificats HTTPS automatiques, l'API
#          sous /api et le front pour tout le reste, sur le MEME domaine (pas
#          de CORS).
#
# Lancement, depuis ce dossier :
#   docker compose up -d --build
# Voir README.md pour le premier deploiement et les mises a jour.

name: jurix

# Le pilote json-file de Docker ne fait tourner aucun journal par defaut :
# chacun grossirait jusqu'a remplir le disque. 3 x 10 Mo par conteneur.
x-journaux: &journaux
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    # Version EPINGLEE, celle de developpement : la colonne articles.embedding
    # est en halfvec (pgvector 0.7 au moins). Une etiquette flottante pouvait
    # changer de version au gre d'une reconstruction.
    image: pgvector/pgvector:0.8.6-pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: jurix
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?renseigner POSTGRES_PASSWORD dans .env}
      POSTGRES_DB: jurix
    # Reglages pour 12 Go partages avec l'API.
    command: >
      postgres
      -c shared_buffers=1GB
      -c effective_cache_size=4GB
      -c maintenance_work_mem=512MB
      -c max_connections=60
    # L'index HNSW se construit en memoire partagee : les 64 Mo par defaut de
    # Docker faisaient echouer sa reconstruction (« could not resize shared
    # memory segment »), observe en developpement.
    shm_size: 1gb
    volumes:
      - db:/var/lib/postgresql/data
      - ./sauvegardes:/sauvegardes
    healthcheck:
      # Par TCP : a sa premiere initialisation, l'image demarre un serveur
      # temporaire qui n'ecoute que sur le socket ; pg_isready par defaut le
      # prendrait pour le vrai, et l'API migrerait un serveur sur le point de
      # s'arreter.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U jurix -d jurix"]
      interval: 10s
      timeout: 5s
      retries: 12
    # A l'arret, PostgreSQL ecrit un dernier point de controle, qui peut
    # depasser les 10 s que Docker accorde avant de le tuer ; tue, il rejoue
    # son journal au demarrage suivant.
    stop_grace_period: 1m
    mem_limit: 4g
    logging: *journaux

  api:
    build:
      context: ../..
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      # La base est le conteneur voisin ; le reseau interne n'a pas de TLS.
      DATABASE_URL: postgresql+asyncpg://jurix:${POSTGRES_PASSWORD}@db:5432/jurix
      PGSSLMODE: disable
      # Fige ici, et non seulement dans .env : un .env recopie d'avant la
      # bascule porterait encore EMBEDDING_PROVIDER=gemma, que la
      # configuration refuse, et l'API redemarrerait en boucle.
      EMBEDDING_PROVIDER: voyage
      # uvicorn croit les en-tetes X-Forwarded-* de Caddy. Sans cela, il se
      # croyait en HTTP : ses redirections (barre oblique finale) partaient
      # vers http://, que le navigateur bloque depuis une page HTTPS. Sans
      # danger : aucun port de l'API n'est publie, seul Caddy la joint.
      FORWARDED_ALLOW_IPS: "*"
      # Derives du domaine, et non recopies dans .env : laisses a
      # jurix.exemple.cm, les liens des courriels (mot de passe oublie)
      # pointaient vers un domaine que n'importe qui peut acheter.
      FRONTEND_BASE_URL: https://${JURIX_DOMAINE}
      ALLOWED_ORIGINS: https://${JURIX_DOMAINE}
    volumes:
      # Les PDF d'origine (visionneuse, telechargement), et les envois futurs.
      - ./donnees/uploads:/app/data/uploads
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      # Migrations au demarrage, puis sonde de Voyage.
      start_period: 120s
    mem_limit: 5g
    logging: *journaux

  front:
    # Le build COPIE dans l'image, et non monte : deployer.sh remplace
    # front-node/ pendant que le conteneur en place tourne encore, et un
    # montage lui changerait ses fichiers en pleine marche. Ni npm ni
    # node_modules : adapter-node integre au build les devDependencies, et
    # deployer.sh refuse des "dependencies", qu'il laisserait en import
    # externe. package.json ne sert que pour son "type": "module".
    build:
      context: ./front-node
      dockerfile_inline: |
        FROM node:24.21.0-alpine
        WORKDIR /app
        COPY package.json ./
        COPY build ./build
        USER node
        CMD ["node", "build"]
    restart: unless-stopped
    # Pas d'env_file : le .env porte les secrets de l'API, et le rendu
    # serveur, qui lit tout son environnement ($env/dynamic/private), n'en a
    # besoin d'aucun.
    environment:
      # L'origine publique : le serveur en tire l'URL de chaque requete (liens
      # canoniques) et l'annonce a l'API, dont ALLOWED_ORIGINS vient du meme
      # domaine. VITE_API_URL, figee au build, doit le designer aussi : sinon
      # les pages s'affichent, mais le navigateur envoie ses appels a l'API
      # (recherche, connexion, chat) ailleurs. deployer.sh et demarrer.sh le
      # verifient.
      ORIGIN: https://${JURIX_DOMAINE}
      # Le rendu serveur appelle l'API par le reseau interne, au lieu de
      # ressortir par l'IP publique et de revenir par Caddy
      # (src/hooks.server.ts du front).
      API_INTERNE: http://api:8000
      # Caddy garde ses connexions vers le front 2 min sans activite, Node 5 s
      # par defaut : Caddy pourrait reutiliser une connexion que Node ferme au
      # meme instant, et le visiteur recevrait une 502. Node les garde donc
      # plus longtemps ; HEADERS_TIMEOUT doit depasser KEEP_ALIVE_TIMEOUT.
      KEEP_ALIVE_TIMEOUT: "125"
      HEADERS_TIMEOUT: "126"
      # Les requetes en cours finissent a l'arret, dans les 10 s que Docker
      # accorde avant de tuer le conteneur.
      SHUTDOWN_TIMEOUT: "8"
      # Le tas de V8 plafonne sous mem_limit : Node ramasse ses dechets avant
      # que le noyau ne tue le conteneur.
      NODE_OPTIONS: --max-old-space-size=256
      PORT: "3000"
      HOST: 0.0.0.0
    expose:
      - "3000"
    # Sans attendre que l'API soit prete : sans elle, le front rend ses pages
    # en 503, et demarrer.sh attend l'API puis controle le rendu.
    depends_on:
      - api
    healthcheck:
      # Un fichier du build, et non une page : une panne de l'API ne doit pas
      # faire passer le front pour malade. 127.0.0.1 et non localhost, qui
      # peut se resoudre en ::1, ou Node n'ecoute pas.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/favicon.svg"]
      interval: 30s
      timeout: 5s
      retries: 3
    mem_limit: 384m
    logging: *journaux

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      JURIX_DOMAINE: ${JURIX_DOMAINE:?renseigner JURIX_DOMAINE dans .env}
    volumes:
      # Le DOSSIER, pas le fichier : un fichier monte seul garde l'ancienne
      # version quand une mise a jour le remplace. Il porte aussi
      # maintenance.html, la page servie quand le front ou l'API ne repond pas.
      - ./caddy:/etc/caddy:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
      - front
    mem_limit: 256m
    logging: *journaux

volumes:
  db:
  caddy_data:
  caddy_config:
