[tool.poetry]
name = "jurix-backend"
version = "3.0.0"
description = "JuriX v2.1 Backend API - Plateforme Juridique Camerounaise"
authors = ["JuriX Team"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.11"
# Core Framework
fastapi = "^0.104.0"
uvicorn = {extras = ["standard"], version = "^0.24.0"}
pydantic = "^2.5.0"
pydantic-settings = "^2.1.0"

# Database
sqlalchemy = "^2.0.23"
alembic = "^1.12.1"
psycopg2-binary = "^2.9.9"
asyncpg = "^0.29.0"
pgvector = "^0.2.3"

# (Async background processing via FastAPI BackgroundTasks - no broker needed)

# Security
python-jose = {extras = ["cryptography"], version = "^3.3.0"}
passlib = {extras = ["bcrypt"], version = "^1.7.4"}
python-multipart = "^0.0.6"

# (Meilisearch replaced by PostgreSQL tsvector + pg_trgm)

# Document Processing
pypdf = "^3.17.0"
pdfplumber = "^0.10.0"  # Better text extraction with layout preservation
python-docx = "^1.1.0"
pytesseract = "^0.3.10"
pdf2image = "^1.16.3"

# NLP & ML - Détection Langue v2.1
numpy = ">=1.26.0,<2.0.0"  # Pin to 1.x for fasttext compatibility
langdetect = "^1.0.9"
fasttext = "^0.9.2"

# ML - Catégorisation v2.1
scikit-learn = "^1.3.2"
joblib = "^1.3.2"

# Embeddings & RAG

# LLM - Gemini API
google-generativeai = "^0.8.0"

# Utils
python-dotenv = "^1.0.0"
httpx = "^0.25.2"

[tool.poetry.group.dev.dependencies]
# Testing
pytest = "^7.4.3"
pytest-asyncio = "^0.21.1"
pytest-cov = "^4.1.0"
pytest-mock = "^3.12.0"
pytest-timeout = "^2.2.0"
httpx = "^0.25.2"
aiosqlite = "^0.19.0"  # For async SQLite in tests

# Linting & Formatting
black = "^23.11.0"
ruff = "^0.1.6"
mypy = "^1.7.1"
pylint = "^3.0.3"

# Type stubs


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
target-version = ['py311']

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
# Timeout configuration
timeout = 300  # Default 5 minutes for all tests
timeout_method = "thread"
# Test markers
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]

[tool.pyrefly]
# Exclude large directories to reduce memory usage
project_excludes = [
    "../frontend",
    "models/fasttext",
    "models/*.bin",
    "models/*.pkl",
    "../data",
    "data",
    "htmlcov",
    ".pytest_cache",
]
python_version = "3.11"
