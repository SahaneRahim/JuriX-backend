[pytest]
# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Asyncio mode
asyncio_mode = auto
# Portee de boucle alignee sur les fixtures de session : sans cette ligne
# pytest-asyncio cree une boucle par test, et le moteur de base cree dans la
# fixture de session appartient alors a une boucle morte -> "another operation
# is in progress" sur chaque SAVEPOINT.
asyncio_default_fixture_loop_scope = session

# Timeout configuration
timeout = 300
timeout_method = thread

# Test markers
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    unit: marks tests as unit tests
    api: marks tests as API tests
    services: marks tests as service tests

# Output options
# La couverture n'est PAS dans addopts : elle rendait pytest-cov obligatoire
# pour seulement lancer `pytest`. Pour un rapport de couverture :
#   pytest --cov=app --cov-report=term-missing --cov-branch
addopts =
    --verbose
    --strict-markers
    --tb=short

# Minimum coverage threshold (optional, uncomment to enforce)
# --cov-fail-under=80

# Logging
log_cli = false
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Warnings
filterwarnings =
    error
    ignore::UserWarning
    ignore::DeprecationWarning

# Coverage options
[coverage:run]
source = app
omit =
    */tests/*
    */migrations/*
    */__pycache__/*
    */site-packages/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False

[coverage:html]
directory = htmlcov
